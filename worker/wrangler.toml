name = "quitutes-da-ruiva-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Não apaga as variáveis criadas no painel da Cloudflare a cada deploy
keep_vars = true

# Coloque a API no mesmo domínio do site (Cloudflare Pages) para não precisar de CORS:
# routes = [{ pattern = "encomendas.quitutesdaruiva.com.br/api/*", zone_name = "quitutesdaruiva.com.br" }]

# Liga a API ao Worker do site: um Worker não consegue buscar outro *.workers.dev da mesma conta pela URL
# (volta 404), então a imagem do cardápio é baixada por este binding.
[[services]]
binding = "SITE"
service = "quitutes-da-ruiva"

[vars]
SITE_URL = "https://quitutes-da-ruiva.lucas-giovannicr.workers.dev"
# Origens extras permitidas (separadas por vírgula), ex.: o domínio *.pages.dev durante os testes
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
# URL pública da imagem do cardápio (web/assets/cardapio.jpg publicada no Pages). Vazio = cardápio em texto.
CARDAPIO_IMAGE_URL = "https://quitutes-da-ruiva.lucas-giovannicr.workers.dev/assets/cardapio.jpg"
# "1" = não chama o whatsapp-backend, só registra no log (bom para testar)
WHATSAPP_MOCK = "0"

# Secrets (configure com `npx wrangler secret put NOME` ou em .secrets.prod.json):
#   SUPABASE_URL, SUPABASE_SECRET_KEY (sb_secret_...; a service_role antiga também funciona em SUPABASE_SERVICE_KEY)
#   WHATSAPP_BACKEND_URL endereço do whatsapp-backend (ex.: https://wa.seudominio.com.br)
#   WHATSAPP_API_KEY     API key do tenant com os escopos messages:send, instances:read e instances:manage
#   ADMIN_EMAILS         e-mails que podem entrar no painel, separados por vírgula
#   PIX_KEY              chave Pix enviada ao cliente
#   RUIVA_PHONE          WhatsApp da Ruiva para avisos (55DDDNÚMERO), opcional
#   TURNSTILE_SECRET     opcional; se definido, o formulário exige o captcha
